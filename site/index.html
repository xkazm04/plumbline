<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Content-Security-Policy. The Desk holds the visitor's LLM key and, while signing, a private key in memory, and
    renders model-written content, so it runs under the strictest policy that keeps every Desk function working.
    site/tests/csp.test.mjs checks this tag; site/README.md (Content-Security-Policy) explains it. Each relaxation:
    - script-src 'self': every script is a same-origin module (desk.js, shell.js, site.js and their imports; the runtime's dynamic
      imports in site.js and runtime/action-transport.js are same-origin). No inline script, no inline handler, no
      eval or new Function anywhere the page runs, so no 'unsafe-inline' and no 'unsafe-eval'.
    - style-src: fix.css and assistant.css ('self'; the page's own code adds no inline style: shell.js sets only custom
      properties through the CSSOM, which style-src does not govern), plus hashes for the vendored runtime's fixed
      inline styles, which we may not edit: the <style> block runtime/ui.js:279 builds from BASE_CSS (runtime/ui.js:85 + runtime/cruse-render.js:3),
      and six constant style="" attributes in runtime/ui.js (356, 370, 372, 1595, 1624, 1642), which need
      'unsafe-hashes'. That allows exactly those seven texts, not inline styles in general: model-written content
      cannot add a style. The test recomputes the hashes from the runtime, so a runtime update that changes them fails.
    - img-src 'self': the page shows no image today; the runtime renders a theme logo <img> (runtime/ui.js:337) if the
      manifest ever sets one. No fonts are loaded, so font-src stays at default-src 'none'.
    - connect-src cannot be a short allow-list: the gate, drift and verify read ANY https site the visitor names
      (desk.js:69), and the model router is the visitor's choice (hosted Otari, Groq, OpenAI, Google, Anthropic or any
      OpenAI-compatible URL, runtime/ui.js:31-75 and runtime/llm.js:123), including Ollama on http://localhost. So: 'self',
      https:, and http on localhost and 127.0.0.1 only. Plain http to other hosts is refused.
    - worker-src 'self': the coded-tool sandbox is a same-origin module worker loaded by URL (runtime/sandbox.js:35).
      Its blob: import happens inside the worker, under the worker's own policy (see site/_headers), not this one.
    - frame-src: when the assistant calls a partner, the runtime frames that partner's action bridge in a hidden frame
      (runtime/action-transport.js:107-113): Agent Atlas and Agent Customs (our allowed_peers in agent-manifest.json)
      and Agent Customs' own peer, agent-customs-range.github.io. A bridge outside this list falls back to the
      runtime's user-opened popup (runtime/action-transport.js:153-154).
    - frame-ancestors does not work in a meta tag; site/_headers sends it on hosts that honour that file.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-hashes' 'sha256-w9bymhJ4S9BFR8jkOL9IzPIelA+8lILrhSALVNM7y5k=' 'sha256-Dh8E4+n+gtXPNPjrXtaww2ge8cPC+vOqjhX7MXHBbqw=' 'sha256-q3nqK4VzeI/SowYCYQ/tCfo056B/JMutuSpzbJbHczk=' 'sha256-i4PrIz85o9AfEDwwB+ARpsK/O/5ma+Q5EDKQLdXZ/1M=' 'sha256-LJVOt4FAE3nNOLZf7+FWk9PQifzUZwTAOUbh4kRjs/E=' 'sha256-aqNNdDLnnrDOnTNdkJpYlAxKVJtLt9CtFLklmInuUAE=' 'sha256-5QovU8lFNNr8yzeA3ON3wVRo1xAkOwVzhgpX8jFwsWE='; img-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self'; frame-src https://agent-atlas-phi.vercel.app https://montbaga.github.io https://agent-customs-range.github.io; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plumbline Desk</title>
  <link rel="stylesheet" href="fix.css">
  <link rel="stylesheet" href="assistant.css">
  <script type="module" src="desk.js"></script>
  <script type="module" src="shell.js"></script>
  <script type="module" src="site.js"></script>
</head>
<body>
  <!-- Structure only: every visible string comes from strings.js (data-s keys; data-label gives an aria-label).
       The Desk is "The Fix" (contest B/3): a chart, a compass card with five ports, and one focused view per port,
       chosen by the address hash (#/check, #/drift, #/verify, #/key, #/sign, #/about). shell.js shows one view at a
       time and draws the art; desk.js runs every tool. site/PORT.md lists each view and what it leaves out. -->
  <a class="skip" href="#main" data-s="header.skip"></a>
  <noscript><p class="noscript" data-s="meta.noscript">The Plumbline Desk runs in your browser and needs JavaScript.</p></noscript>

  <!-- The chart: drawn paper and a graduated border. Decorative. -->
  <div class="paper" id="paper" aria-hidden="true" data-role="page"></div>

  <div class="stage" id="stage" data-level="1">
    <header class="title" id="title">
      <h1 class="title__h">
        <span class="title__brand" data-role="brand"><span class="brandmark" aria-hidden="true"></span><span data-s="header.name"></span></span>
        <span class="title__q" data-role="title" data-s="header.question"></span>
      </h1>
      <p class="title__tag" data-role="subtitle" data-s="header.tagline"></p>
      <p class="title__plain" data-role="lead" data-s="header.plain"></p>
      <p class="title__more"><a href="#/about" data-s="header.aboutLink"></a></p>
    </header>

    <p class="ghost" id="ghost" aria-hidden="true"></p>

    <main id="main" class="main" tabindex="-1">
      <!-- The overview: the compass card, the five ports, the sites checked and the peer ports. No tool runs here. -->
      <section class="home" id="home" data-label="fix.portsLabel">
        <div class="dial" id="dial" data-role="compass"></div>
        <ul class="homelogs" id="homelogs" data-label="fix.checkersLabel"></ul>
        <nav class="portlist" id="portlist" aria-labelledby="ports-heading">
          <h2 class="portlist__h" id="ports-heading" data-role="port-list-heading" data-s="fix.portsHeading"></h2>
          <ul id="portlist-items"></ul>
        </nav>
        <div class="pager" id="pager" role="group" aria-labelledby="sites-heading">
          <h2 class="pager__h" id="sites-heading" data-role="sites-heading" data-s="fix.sitesHeading"></h2>
          <div class="pager__list" id="pager-list"></div>
          <p class="note pager__note" id="pager-note"></p>
        </div>
        <aside class="peers" id="partners" aria-labelledby="partners-heading">
          <h2 class="peers__h" id="partners-heading" data-role="peers-heading" data-s="partners.heading"></h2>
          <p class="peers__lane" data-s="partners.lane"></p>
          <div class="peer">
            <p class="peer__name" data-role="peer-name"><a data-href="partners.atlasLink" data-s="partners.atlasName"></a></p>
            <span class="peer__role" data-s="partners.atlasText"></span>
          </div>
          <div class="peer">
            <p class="peer__name"><a data-href="partners.customsLink" data-s="partners.customsName"></a></p>
            <span class="peer__role" data-s="partners.customsText"></span>
          </div>
          <button id="partners-check" type="button" class="btn btn--ghost btn--small" data-s="partners.button"></button>
          <p id="partners-status" class="msg" role="status" aria-live="polite"></p>
          <div id="partners-result" class="result"></div>
        </aside>
      </section>

      <!-- Port 1: check a site (the gate). The fix on the left, the address and the checkers' sentences on the right. -->
      <section class="tool" id="gate" data-tool="check" hidden aria-labelledby="gate-heading">
        <header class="tool__head">
          <p class="tool__kicker" data-role="tool-kicker" data-port-kicker="1"></p>
          <h2 class="tool__title" id="gate-heading" tabindex="-1" data-role="tool-title" data-s="gate.heading"></h2>
          <p class="tool__sub" data-role="tool-sub" data-s="fix.ports.check.sub"></p>
        </header>
        <ol class="strip" data-strip="check"></ol>
        <div class="tool__body">
          <div class="tool__art">
            <div class="fixwrap" id="gate-fix"></div>
          </div>
          <div class="tool__panel" data-role="tool-panel">
            <h3 class="panel-h" data-role="panel-heading" data-s="gate.formHeading"></h3>
            <form id="gate-form" class="field">
              <label for="gate-target" data-role="field-label" data-s="gate.label"></label>
              <input id="gate-target" name="target" type="url" required autocomplete="url" spellcheck="false" data-role="field-input" data-placeholder="gate.placeholder">
              <p class="note" id="gate-sent-where" data-s="gate.sentWhere"></p>
              <div class="btnrow"><button id="gate-run" class="btn" type="submit" data-role="primary-button" data-s="gate.button"></button></div>
            </form>
            <p id="gate-status" class="msg" role="status" aria-live="polite"></p>
            <p class="note" data-s="gate.lead"></p>
            <h3 class="panel-h" data-s="gate.resultHeading"></h3>
            <div id="gate-result" class="result"></div>
            <h3 class="panel-h" data-s="fix.howToReadHeading"></h3>
            <p class="serif-note" data-s="fix.howToRead"></p>
            <p class="note rule" data-s="fix.rule"></p>
          </div>
        </div>
      </section>

      <!-- Port 2: read drift. The plotted course on the left, the lock and its findings on the right. -->
      <section class="tool" id="drift" data-tool="drift" hidden aria-labelledby="drift-heading">
        <header class="tool__head">
          <p class="tool__kicker" data-port-kicker="2"></p>
          <h2 class="tool__title" id="drift-heading" tabindex="-1" data-s="drift.heading"></h2>
          <p class="tool__sub" data-s="fix.ports.drift.sub"></p>
        </header>
        <ol class="strip" data-strip="drift"></ol>
        <div class="tool__body">
          <div class="tool__art">
            <div class="course" id="drift-course"></div>
            <p class="note course__cap" id="drift-caption"></p>
          </div>
          <div class="tool__panel">
            <h3 class="panel-h" data-s="drift.formHeading"></h3>
            <form id="drift-form" class="field">
              <label for="drift-target" data-s="drift.label"></label>
              <input id="drift-target" name="target" type="url" required autocomplete="url" spellcheck="false" data-placeholder="drift.placeholder">
              <div class="btnrow"><button id="drift-run" class="btn" type="submit" data-s="drift.button"></button></div>
            </form>
            <p id="drift-status" class="msg" role="status" aria-live="polite"></p>
            <p class="note" data-s="drift.lead"></p>
            <h3 class="panel-h" data-s="drift.resultHeading"></h3>
            <div id="drift-result" class="result"></div>
            <!-- UAT-26: a site's own partners, before they load (lib/plumbline/browser/preload.js) -->
            <h3 class="panel-h" data-s="sitePeers.heading"></h3>
            <p class="note" data-s="sitePeers.lead"></p>
            <form id="site-peers-form" class="field">
              <label for="site-peers-target" data-s="sitePeers.label"></label>
              <input id="site-peers-target" name="target" type="url" required autocomplete="url" spellcheck="false" data-placeholder="sitePeers.placeholder">
              <div class="btnrow"><button id="site-peers-run" class="btn" type="submit" data-s="sitePeers.button"></button></div>
            </form>
            <p id="site-peers-status" class="msg" role="status" aria-live="polite"></p>
            <div id="site-peers-result" class="result"></div>
          </div>
        </div>
      </section>

      <!-- Port 3: verify a signature. The papers (the signature and your register of trusted seals) on the left, the
           verdict on the right. -->
      <section class="tool" id="verify" data-tool="verify" hidden aria-labelledby="verify-heading">
        <header class="tool__head">
          <p class="tool__kicker" data-port-kicker="3"></p>
          <h2 class="tool__title" id="verify-heading" tabindex="-1" data-s="verify.heading"></h2>
          <p class="tool__sub" data-s="fix.ports.verify.sub"></p>
        </header>
        <ol class="strip" data-strip="verify"></ol>
        <div class="tool__body">
          <div class="tool__art tool__art--scroll">
            <div class="papers">
              <div class="sheet sheet--doc" id="verify-sheet"></div>
              <div class="sheet sheet--reg">
                <h3 class="sheet__h" id="trust-heading" data-s="verify.trustListHeading"></h3>
                <p class="note" data-s="verify.trustListNote"></p>
                <div id="trust-list" class="result"></div>
                <div class="trustfile">
                  <p class="note" data-s="verify.trustFileNote"></p>
                  <div class="btnrow"><button id="trust-export" type="button" class="btn btn--ghost btn--small" data-s="verify.exportButton"></button></div>
                  <div class="field">
                    <label for="trust-import" data-s="verify.importLabel"></label>
                    <input id="trust-import" type="file" accept=".json,application/json">
                  </div>
                  <p id="trust-io-status" class="msg" role="status" aria-live="polite"></p>
                  <div id="trust-io-result" class="result"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="tool__panel">
            <h3 class="panel-h" data-s="verify.formHeading"></h3>
            <form id="verify-form" class="field">
              <label for="verify-target" data-s="verify.label"></label>
              <input id="verify-target" name="target" type="url" required autocomplete="url" spellcheck="false" data-placeholder="verify.placeholder">
              <div class="btnrow"><button id="verify-run" class="btn" type="submit" data-s="verify.button"></button></div>
            </form>
            <p id="verify-status" class="msg" role="status" aria-live="polite"></p>
            <p class="note" data-s="verify.lead"></p>
            <h3 class="panel-h" data-s="verify.resultHeading"></h3>
            <div id="verify-result" class="result"></div>
            <h3 class="panel-h" id="verdicts-heading" data-s="verdicts.heading"></h3>
            <p class="note" data-s="verdicts.lead"></p>
            <dl class="legend">
              <dt><span class="chip chip-verified"><span class="chip-icon" aria-hidden="true">✓</span><span class="chip-words" data-s="verdicts.verifiedTitle"></span></span></dt>
              <dd data-s="verdicts.verifiedMeaning"></dd>
              <dt><span class="chip chip-invalid"><span class="chip-icon" aria-hidden="true">✕</span><span class="chip-words" data-s="verdicts.invalidTitle"></span></span></dt>
              <dd data-s="verdicts.invalidMeaning"></dd>
              <dt><span class="chip chip-unverifiable"><span class="chip-icon" aria-hidden="true">?</span><span class="chip-words" data-s="verdicts.unverifiableTitle"></span></span></dt>
              <dd data-s="verdicts.unverifiableMeaning"></dd>
            </dl>
          </div>
        </div>
      </section>

      <!-- Port 4: make a publisher key. The die and its seal on the left, the key and its custody on the right. -->
      <section class="tool" id="key" data-tool="key" hidden aria-labelledby="key-heading">
        <header class="tool__head">
          <p class="tool__kicker" data-port-kicker="4"></p>
          <h2 class="tool__title" id="key-heading" tabindex="-1" data-s="key.heading"></h2>
          <p class="tool__sub" data-s="fix.ports.key.sub"></p>
        </header>
        <ol class="strip" data-strip="key"></ol>
        <div class="tool__body">
          <div class="tool__art">
            <div class="signet">
              <div class="die" id="key-die"></div>
              <div class="impress" id="key-seal"></div>
              <p class="impress__kid" id="key-seal-kid"></p>
            </div>
          </div>
          <div class="tool__panel">
            <p class="lead" data-s="key.lead"></p>
            <div class="btnrow">
              <button id="key-generate" class="btn" type="button" data-s="key.button"></button>
              <button id="key-discard" type="button" class="btn btn--ghost" hidden data-s="key.discard"></button>
            </div>
            <p id="key-status" class="msg" role="status" aria-live="polite"></p>
            <div id="key-result" class="result"></div>
            <h3 class="panel-h" id="custody-heading" data-s="key.custodyHeading"></h3>
            <ol id="custody-list" class="custody"></ol>
            <h3 class="panel-h" id="revoke-heading" data-s="revoke.heading"></h3>
            <p class="note" data-s="revoke.lead"></p>
            <div class="field">
              <label for="revoke-key" data-s="revoke.keyLabel"></label>
              <input id="revoke-key" type="file" accept=".json,application/json">
            </div>
            <div class="field">
              <label for="revoke-reason" data-s="revoke.reasonLabel"></label>
              <input id="revoke-reason" type="text" maxlength="500" autocomplete="off">
            </div>
            <div class="field">
              <label for="revoke-existing" data-s="revoke.existingLabel"></label>
              <input id="revoke-existing" type="file" accept=".json,application/json">
            </div>
            <div class="btnrow"><button id="revoke-make" type="button" class="btn btn--ghost" data-s="revoke.button"></button></div>
            <p id="revoke-status" class="msg" role="status" aria-live="polite"></p>
            <div id="revoke-result" class="result"></div>
          </div>
        </div>
      </section>

      <!-- Port 5: sign a site's files. The manifest (every file and its SHA-256) on the left, the choices on the right. -->
      <section class="tool" id="sign" data-tool="sign" hidden aria-labelledby="sign-heading">
        <header class="tool__head">
          <p class="tool__kicker" data-port-kicker="5"></p>
          <h2 class="tool__title" id="sign-heading" tabindex="-1" data-s="sign.heading"></h2>
          <p class="tool__sub" data-s="fix.ports.sign.sub"></p>
        </header>
        <ol class="strip" data-strip="sign"></ol>
        <div class="tool__body">
          <div class="tool__art">
            <div class="ledger">
              <h3 class="ledger__h" data-s="sign.ledgerHeading"></h3>
              <p class="ledger__sub" data-s="sign.ledgerSub"></p>
              <div id="sign-ledger" class="cargo"></div>
            </div>
          </div>
          <div class="tool__panel">
            <p class="lead" data-s="sign.lead"></p>
            <h3 class="panel-h" data-s="sign.filesHeading"></h3>
            <div class="field">
              <label for="sign-files" data-s="sign.filesLabel"></label>
              <input id="sign-files" type="file" multiple accept=".json,.js,.mjs,.html,.hocon,application/json,text/javascript,text/html">
            </div>
            <h3 class="panel-h" data-s="sign.keyHeading"></h3>
            <div class="field">
              <label for="sign-key" data-s="sign.keyLabel"></label>
              <input id="sign-key" type="file" accept=".json,application/json">
            </div>
            <h3 class="panel-h" data-s="sign.originHeading"></h3>
            <div class="field">
              <label for="sign-origin" data-s="sign.originLabel"></label>
              <input id="sign-origin" type="url" autocomplete="off" spellcheck="false" data-placeholder="sign.originPlaceholder">
            </div>
            <div class="field">
              <label for="sign-days" data-s="sign.daysLabel"></label>
              <input id="sign-days" type="number" min="1" max="3650" step="1" value="90">
            </div>
            <div class="btnrow">
              <button id="sign-button" class="btn" type="button" data-s="sign.button"></button>
              <button id="sign-clear" type="button" class="btn btn--ghost" data-s="sign.clear"></button>
            </div>
            <p id="sign-status" class="msg" role="status" aria-live="polite"></p>
            <div id="sign-result" class="result"></div>
          </div>
        </div>
      </section>

      <!-- Not a port: what Plumbline is, and how to publish with the CLI. Reading only. -->
      <section class="tool" id="about" data-tool="about" hidden aria-labelledby="about-heading">
        <header class="tool__head">
          <p class="tool__kicker" data-s="fix.aboutKicker"></p>
          <h2 class="tool__title" id="about-heading" tabindex="-1" data-s="about.heading"></h2>
          <p class="tool__sub" data-s="fix.aboutSub"></p>
        </header>
        <ol class="strip" data-strip="about"></ol>
        <div class="tool__body">
          <div class="tool__art tool__art--scroll">
            <div class="sheet sheet--read">
              <p class="lead" data-s="about.lead"></p>
              <ul class="about-list">
                <li data-s="about.sign"></li>
                <li data-s="about.gate"></li>
                <li data-s="about.watch"></li>
              </ul>
              <p class="lead" data-s="about.desk"></p>
              <p class="lead"><span data-s="about.repoLead"></span> <a data-href="publish.repoLink" data-s="publish.repoName"></a></p>
            </div>
          </div>
          <div class="tool__panel">
            <h3 class="panel-h" id="publish-heading" data-s="publish.heading"></h3>
            <p class="note" data-s="publish.lead"></p>
            <code class="cli" data-s="publish.keygen"></code>
            <code class="cli" data-s="publish.lock"></code>
            <code class="cli" data-s="publish.sign"></code>
            <p class="note" data-s="publish.publishFiles"></p>
            <p class="note" data-s="publish.lockEncouraged"></p>
            <p class="note" data-s="publish.tellKid"></p>
            <p class="note"><span data-s="publish.tools"></span> <a data-href="publish.repoLink" data-s="publish.repoName"></a></p>
            <p class="note rule" data-s="footer.license"></p>
          </div>
        </div>
      </section>
    </main>

    <nav class="trail" id="trail" data-label="fix.trailLabel"></nav>

    <button class="home-compass" id="home-compass" type="button" hidden data-label="fix.homeCompass"></button>
    <button class="dock-tab" id="dock-tab" type="button" aria-expanded="false" aria-controls="assistant" data-role="assistant-button"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M4 6h24v16H15l-6 5v-5H4z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 9l3 4.5h-6z" fill="currentColor"/><path d="M16 18v-4" stroke="currentColor" stroke-width="2.2"/></svg><span data-s="fix.assistantButton"></span></button>

    <!-- The vendored runtime's chat, mounted in the panel the Assistant button opens. Themed only through --ns-*. -->
    <section id="assistant" class="dock" hidden aria-labelledby="assistant-heading">
      <div class="dock__top">
        <h2 class="dock__label" id="assistant-heading" data-s="assistant.heading"></h2>
        <button id="dock-close" class="btn btn--ghost btn--small" type="button" data-s="fix.assistantClose"></button>
      </div>
      <p class="dock__sentence" data-s="assistant.lead"></p>
      <p class="note" data-s="assistant.note"></p>
      <p id="assistant-status" class="note dock__status" role="status" data-s="assistant.connecting"></p>
      <label class="remember" for="remember-ai-key"><input id="remember-ai-key" type="checkbox"><span data-s="assistant.rememberKey"></span></label>
      <p class="note" data-s="assistant.rememberNote"></p>
      <div id="agent-app">
        <div data-ns-slot="header"></div>
        <div class="assistant-panels">
          <div data-ns-slot="chat"></div>
          <div data-ns-slot="agents"></div>
        </div>
        <div data-ns-slot="settings"></div>
      </div>
    </section>
  </div>

  <div class="live" id="live" role="status" aria-live="polite"></div>
  <!-- What the Desk will not do here (in another site's frame, or without Ed25519); desk.js fills and shows it. -->
  <p class="desk-notice" id="desk-notice" role="alert" hidden></p>
</body>
</html>
