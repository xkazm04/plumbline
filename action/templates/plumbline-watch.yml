# Plumbline watch: a check for three drifts (grounding, runtime, peer) against plumbline.lock.json, daily and on every
# push to the default branch that touches the site folder, so a changed page is news when it lands (UAT-30).
# Copy this file to .github/workflows/plumbline-watch.yml in the site's repository, or let `plumbline init --workflow`
# write it with `root:` set to your site folder. Needs plumbline.lock.json committed first: in a clone of
# xkazm04/plumbline at the pinned commit, run `npm ci && node dist/cli/index.js init --root <your site>` (no key is
# needed), and commit the lock. If the site is signed, sign it again (the lock is a signed file) and commit both.
# After you review a drift you accept: `watch --root <your site> --relock` (then sign again if the site is signed).
# It only reads the repository and keeps ONE issue titled "Plumbline drift" (the Action's `issues: true`): opened on
# warn or block findings, edited with a comment naming what is new when they change, closed with a comment on the next
# clean run. That is why it needs `issues: write`. As written it never pushes or opens a PR.
# To have it also propose the relock as ONE pull request a person merges (the Action's `relock-pr: true`):
#   1. add `relock-pr: true` under `with:` below;
#   2. set `permissions:` to `contents: write`, `issues: write` and `pull-requests: write`;
#   3. in the repository's Settings > Actions > General > Workflow permissions, tick "Allow GitHub Actions to create
#      and approve pull requests" (off by default; without it the pull request step fails).
# A pull request opened with the job's own token starts no workflow runs, so your required checks do not run on it
# until a person pushes to its branch (or give the Action's `token:` a fine-grained token or a GitHub App token).
# To have the issue reach a named person (the site's owner, say), give `assignee:` their GitHub login below: the Action
# assigns the issue to them, and GitHub notifies an assignee of the issue and of every comment on it. The person needs
# access to the repository (a collaborator), or GitHub refuses the assignment and the step only warns.
name: Plumbline watch

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:
  # a push that touches the site folder (init --workflow writes your root here); only the default branch is watched,
  # see `if:` below, so a push to a pull request's branch never edits or closes the drift issue
  push:
    paths:
      - "**"

permissions:
  contents: read
  issues: write # the Action keeps the drift issue with the job's token

concurrency:
  group: plumbline-watch
  cancel-in-progress: false

jobs:
  watch:
    # a push is watched on the default branch only: a relock branch, or a person's signature pushed to it, is not what
    # the site publishes, and must never close the drift issue before a person merges it
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned by full commit SHA; the tag is only a comment for humans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The Action builds plumbline from its own checkout: pinning it by commit SHA pins the code that runs. With
      # `issues: true` it also opens, edits (with a comment when the findings change) or closes the drift issue.
      - name: Run plumbline watch
        id: watch
        uses: xkazm04/plumbline/action@69322e769b0b47febd37bd43d1ec8aa13085b290
        with:
          command: watch
          root: "."
          issues: true
          # assignee: your-github-login   # the person the drift issue is assigned to (UAT-30)
          # site-address: https://your-site.example/   # the Desk link in the issue opens the reading of this address

      - name: Findings
        shell: bash
        env:
          FINDINGS: ${{ steps.watch.outputs.findings }}
        run: echo "warn or block findings, $FINDINGS"
