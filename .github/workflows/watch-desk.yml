# Plumbline watching its own Desk (site/): the published template (action/templates/plumbline-watch.yml) with one
# difference, it runs this repository's own Action (`uses: ./action`) at the commit being run instead of a pinned SHA,
# so the repo dogfoods the Action and the issue handling it ships at every commit. Lock: site/plumbline.lock.json.
# It only reads the repository and keeps ONE issue titled "Plumbline drift" (the Action's `issues: true`): opened on
# warn or block findings, edited with a comment naming what is new when they change, closed with a comment on the next
# clean run.
name: Plumbline watch (the Desk)

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the Action keeps the drift issue with the job's token

concurrency:
  group: plumbline-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned by full commit SHA; the tag is only a comment for humans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The Action builds plumbline from its own checkout, here the commit this run checked out. With `issues: true` it
      # also opens, edits (with a comment when the findings change) or closes the drift issue.
      - name: Run plumbline watch on site/
        id: watch
        uses: ./action
        with:
          command: watch
          root: site
          issues: true

      - name: Findings
        shell: bash
        env:
          FINDINGS: ${{ steps.watch.outputs.findings }}
        run: echo "warn or block findings, $FINDINGS"
