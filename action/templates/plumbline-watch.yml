# Plumbline watch: a daily check for three drifts (grounding, runtime, peer) against plumbline.lock.json.
# Copy this file to .github/workflows/plumbline-watch.yml in the site's repository.
# Needs plumbline.lock.json committed first: in a clone of xkazm04/plumbline at the pinned commit, run
# `npm ci && node dist/cli/index.js watch --root <your site> --init`, then sign the site (the lock is a signed file),
# and commit both. After you review a drift you accept: `watch --root <your site> --relock`, sign again, commit both.
# It only reads the repository and keeps ONE issue titled "Plumbline drift" (the Action's `issues: true`): opened on
# warn or block findings, edited with a comment naming what is new when they change, closed with a comment on the next
# clean run. That is why it needs `issues: write`. It never pushes or opens a PR.
name: Plumbline watch

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the Action keeps the drift issue with the job's token

concurrency:
  group: plumbline-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned by full commit SHA; the tag is only a comment for humans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The Action builds plumbline from its own checkout: pinning it by commit SHA pins the code that runs. With
      # `issues: true` it also opens, edits (with a comment when the findings change) or closes the drift issue.
      - name: Run plumbline watch
        id: watch
        uses: xkazm04/plumbline/action@0a50bb1020936f19d3e97ec8af9ab686168b1fd6
        with:
          command: watch
          root: "."
          issues: true

      - name: Findings
        shell: bash
        env:
          FINDINGS: ${{ steps.watch.outputs.findings }}
        run: echo "warn or block findings, $FINDINGS"
