# Plumbline watching its own Desk (site/): the published template (action/templates/plumbline-watch.yml) with one
# difference, it runs this repository's own Action (`uses: ./action`) at the commit being run instead of a pinned SHA,
# so the repo dogfoods the Action and the issue handling it ships at every commit. Lock: site/plumbline.lock.json.
# It only reads the repository and keeps ONE issue titled "Plumbline drift": opened or updated on warn or block
# findings, closed with a comment on the next clean run.
name: Plumbline watch (the Desk)

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: plumbline-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned by full commit SHA; the tag is only a comment for humans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The Action builds plumbline from its own checkout, here the commit this run checked out.
      - name: Run plumbline watch on site/
        id: watch
        uses: ./action
        with:
          command: watch
          root: site

      # The Action read the report once: `findings` counts warn and block, `issue-body` is the issue text for them.
      - name: Open, update or close the drift issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FINDINGS: ${{ steps.watch.outputs.findings }}
          BODY: ${{ steps.watch.outputs.issue-body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A count that is not a number means the Action did not read a report: never take that for clean.
          case "$FINDINGS" in ''|*[!0-9]*) echo "::error::the Action gave no findings count"; exit 1 ;; esac
          # One open issue only: edit it if it exists, create it if it does not, close it when the watch is clean.
          number=$(gh issue list --state open --search '"Plumbline drift" in:title' --json number,title --jq '[.[] | select(.title == "Plumbline drift")][0].number // empty')
          if [ "$FINDINGS" != "0" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$BODY"
              echo "Updated issue #$number"
            else
              gh issue create --title "Plumbline drift" --body-file "$BODY"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Plumbline watch is clean as of $RUN_URL: the locked files, peers and runtime match plumbline.lock.json. Closing. (Clean is not safe: it means nothing locked has drifted.)"
            echo "Closed issue #$number"
          else
            echo "Clean, and no open drift issue."
          fi
