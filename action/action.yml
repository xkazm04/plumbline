name: Plumbline gate
description: Check an agentic website with Plumbline's validator port, Agent Atlas and Agent Customs. An adapter that cannot be reached is `unavailable`, never `pass`.
author: Plumbline

inputs:
  target:
    description: The site address or the network address to check, for example https://example.com/ or https://example.com/my_network.
    required: true
  adapters:
    description: Comma-separated adapters to run, from validator, atlas, customs. Default is all three.
    required: false
    default: validator,atlas,customs
  fail-on:
    description: "`fail` fails the step when the gate state is fail, or when EVERY adapter was unavailable (nothing was checked). `unavailable` also fails it when any adapter could not be reached."
    required: false
    default: fail
  plumbline-ref:
    description: The full commit SHA of xkazm04/plumbline whose code runs (installed from GitHub, never from npm, where the name plumbline belongs to an unrelated package). Pinning this action by commit SHA pins this default too. A test holds it to a commit in this repository's history that builds itself.
    required: false
    default: 2bb7c23c75671b9144b9b9d314b7784a651b5899

outputs:
  state:
    description: The gate state, pass, fail or unavailable.
    value: ${{ steps.gate.outputs.state }}
  report:
    description: Path to the JSON report the gate wrote.
    value: ${{ steps.gate.outputs.report }}

runs:
  using: composite
  steps:
    - name: Run plumbline gate
      id: gate
      shell: bash
      # Inputs reach the script through the environment, never by interpolation into the script text.
      env:
        PLUMBLINE_TARGET: ${{ inputs.target }}
        PLUMBLINE_ADAPTERS: ${{ inputs.adapters }}
        PLUMBLINE_FAIL_ON: ${{ inputs.fail-on }}
        PLUMBLINE_REF: ${{ inputs.plumbline-ref }}
      run: |
        case "$PLUMBLINE_FAIL_ON" in
          fail|unavailable) ;;
          *) echo "::error::fail-on must be fail or unavailable"; exit 2 ;;
        esac
        # A full 40-character commit SHA only (no branch, tag or short SHA), so the code that runs is the one named.
        if ! printf '%s' "$PLUMBLINE_REF" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "::error::plumbline-ref must be a full 40-character commit SHA"; exit 2
        fi
        report="$RUNNER_TEMP/plumbline-gate.json"
        # GitHub runs this with -e; the exit code is needed, so errexit is off for the one command.
        # It is read straight from the command, not through a pipe: 0 passed by fail-on, 1 failed by it (or nothing was
        # checked), 2 usage. The gate never gets --allow-local here: CI checks public https sites only.
        set +e
        npx --yes "github:xkazm04/plumbline#$PLUMBLINE_REF" gate "$PLUMBLINE_TARGET" --adapters "$PLUMBLINE_ADAPTERS" --fail-on "$PLUMBLINE_FAIL_ON" --json > "$report"
        code=$?
        cat "$report"
        state=$(node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(String(r.state));' "$report" 2>/dev/null || echo unknown)
        echo "state=$state" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        {
          echo "### Plumbline gate: $state"
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); for (const f of r.findings) console.log("- **" + f.adapter + "**: " + f.state + ". " + f.summary);' "$report" 2>/dev/null || true
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$code"
