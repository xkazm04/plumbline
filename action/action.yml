name: Plumbline
description: Check an agent against its approved lock (plumbline.agent.lock.json; an unapproved change fails), gate an agentic website (validator port, Agent Atlas, Agent Customs; unreachable is `unavailable`, never `pass`) or watch a site for drift against its plumbline.lock.json and keep its drift issue. Runs the code of the commit you pin.
author: Plumbline

inputs:
  target:
    description: For `gate`, the site address or the network address to check, for example https://example.com/ or https://example.com/my_network. Empty, the gate checks the site's files at `root` instead (a branch before deployment), with the validator only and nothing sent to a third party.
    required: false
    default: ""
  adapters:
    description: Comma-separated adapters to run, from validator, atlas, customs. Default is all three.
    required: false
    default: validator,atlas,customs
  fail-on:
    description: "`fail` fails the step when the gate state is fail, or when EVERY adapter was unavailable (nothing was checked). `unavailable` also fails it when any adapter had no verdict; Agent Customs has receipts for few sites, so with `unavailable` leave customs out of `adapters` or nearly every site fails."
    required: false
    default: fail
  command:
    description: "`agent` runs `plumbline agent check` in the repository folder at `root` (the agent against its approved lock; an unapproved change fails); `gate` checks `target` with the three adapters; `watch` reports drift of the site at `root` against its plumbline.lock.json."
    required: false
    default: gate
  root:
    description: For `watch`, the site folder holding plumbline.lock.json, relative to the workspace; for `gate` with no `target`, the folder of the site's files to check (a build output). Default is the workspace itself. A path that is not a folder is refused.
    required: false
    default: "."
  issues:
    description: "For `watch`: `true` keeps ONE open issue titled `Plumbline drift`. It is opened on warn or block findings, edited when they change (with a comment naming what is new, a new `block` first), and closed with a comment on the next clean run. The job needs `permissions: issues: write`. `false` (the default) leaves the issue to you, with the `findings` and `issue-body` outputs."
    required: false
    default: "false"
  token:
    description: "For `issues`, `relock-pr` and `renew`, the token the drift issue and the pull request are kept with. The default is the job's own token, which needs `issues: write` (and `contents: write` and `pull-requests: write` for a pull request)."
    required: false
    default: ${{ github.token }}
  relock-pr:
    description: "For `watch`: `true` keeps ONE pull request on the branch `plumbline/relock` that accepts the drift: `watch --relock` rewrites the lock, and the body lists what changed and the findings. It is never signed by the run (UAT-34: CI signs nothing a person has not reviewed): for a signed site the body says to sign the branch locally after review and the pull request is a draft; merged unsigned, the `renew` workflow signs the merged files. A person merges; nothing is accepted by the run. The job needs `contents: write` and `pull-requests: write`."
    required: false
    default: "false"
  renew:
    description: "For `watch`: `true` keeps ONE pull request on the branch `plumbline/renew` that signs the site again when its signature expires within 14 days or has expired, or no longer covers the files on the checked-out branch (a relock merged unsigned). Needs `signing-key` and `origin`."
    required: false
    default: "false"
  signing-key:
    description: "For `renew` only (a relock pull request is never signed by the run): the JSON of a plumbline.private.json, from a secret (`${{ secrets.PLUMBLINE_SIGNING_KEY }}`). It reaches the CLI through an environment variable only (`sign --key-env`), is never printed and never written to disk."
    required: false
    default: ""
  origin:
    description: "With `signing-key`: the https origin the site is published from, as `plumbline sign --origin` takes it."
    required: false
    default: ""
  assignee:
    description: "For `watch` with `issues: true`: a GitHub login the drift issue is assigned to when it is opened (and on each edit, if it is not yet), so the news reaches a named person: GitHub notifies an assignee of the issue and of every comment on it. The person needs access to the repository; if GitHub refuses the assignment the step warns and the issue stays as it is."
    required: false
    default: ""
  site-address:
    description: "For `watch`: the https address the site is published at, such as https://example.org/. The drift issue and the relock pull request then open with a link to the Desk's reading of that address, filled in, so the site's owner can see it in a browser with no install. Empty, the address the site's own plumbline.signature.json names is used; with neither, the issue says where the Desk is."
    required: false
    default: ""
  desk:
    description: "For `watch`: the Desk the issue links to (an https address). Default the public Plumbline Desk."
    required: false
    default: "https://plumbline.xkazm04.workers.dev/"
  offline:
    description: "For `agent`: `true` checks the repository's files and the approval only (`agent check --offline`): no remote MCP server or peer is asked, which suits a pull request. `false` (the default) checks those too."
    required: false
    default: "false"
  approvers:
    description: "For `agent`: the JSON text of the approvers file (the people whose keys may approve the agent lock), from a repository variable a pull request cannot edit: `${{ vars.PLUMBLINE_APPROVERS }}`. It reaches the CLI as PLUMBLINE_APPROVERS. Empty, every approval is unverifiable and the check fails."
    required: false
    default: ""

outputs:
  state:
    description: For `gate`, the gate state, pass, fail or unavailable. For `agent`, pass (clean and approved), fail (findings) or unknown (the report could not be read).
    value: ${{ steps.run.outputs.state }}
  report:
    description: Path to the JSON report plumbline wrote.
    value: ${{ steps.run.outputs.report }}
  findings:
    description: For `watch`, how many findings of severity warn or block the report holds.
    value: ${{ steps.run.outputs.findings }}
  issue-body:
    description: For `watch`, path to a Markdown file with the drift issue's body (warn and block findings, and what to do about them).
    value: ${{ steps.run.outputs.issue-body }}
  issue-action:
    description: "For `watch` with `issues: true`, what was done to the drift issue: create, edit, close or none."
    value: ${{ steps.issue-plan.outputs.action }}
  pr-action:
    description: "For `watch` with `relock-pr` or `renew`, what was done to the pull request: create, edit, describe (a refused relock: the body says so, nothing pushed), close or none."
    value: ${{ steps.pr-plan.outputs.action }}

runs:
  using: composite
  steps:
    # Every refusal comes before the build, so a misconfigured workflow goes red at once with its reason. The decision is
    # report.mjs's inputProblem, which action/report.test.mjs tests. Inputs reach scripts through the environment, never
    # by interpolation into the script text.
    - name: Check the inputs
      shell: bash
      env:
        PLUMBLINE_OFFLINE: ${{ inputs.offline }}
        PLUMBLINE_COMMAND: ${{ inputs.command }}
        PLUMBLINE_TARGET: ${{ inputs.target }}
        PLUMBLINE_FAIL_ON: ${{ inputs.fail-on }}
        PLUMBLINE_ROOT: ${{ inputs.root }}
        PLUMBLINE_ISSUES: ${{ inputs.issues }}
        PLUMBLINE_RELOCK_PR: ${{ inputs.relock-pr }}
        PLUMBLINE_RENEW: ${{ inputs.renew }}
        PLUMBLINE_SIGNING_KEY: ${{ inputs.signing-key }}
        PLUMBLINE_ORIGIN: ${{ inputs.origin }}
        PLUMBLINE_SITE_ADDRESS: ${{ inputs.site-address }}
        PLUMBLINE_DESK: ${{ inputs.desk }}
        PLUMBLINE_ASSIGNEE: ${{ inputs.assignee }}
      run: node "$GITHUB_ACTION_PATH/report.mjs" inputs

    # The code that runs is this action's own checkout: pinning the action by commit SHA pins the code, with no package
    # registry in between (the npm name plumbline belongs to an unrelated project, and npx's git installs break on the
    # runner's npm). npm ci also runs the prepare build.
    - name: Build plumbline from this action's commit
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/.."
        npm ci --no-audit --no-fund
        npm run build

    - name: Run plumbline
      id: run
      shell: bash
      env:
        PLUMBLINE_COMMAND: ${{ inputs.command }}
        PLUMBLINE_TARGET: ${{ inputs.target }}
        PLUMBLINE_ADAPTERS: ${{ inputs.adapters }}
        PLUMBLINE_FAIL_ON: ${{ inputs.fail-on }}
        PLUMBLINE_ROOT: ${{ inputs.root }}
        PLUMBLINE_SITE_ADDRESS: ${{ inputs.site-address }}
        PLUMBLINE_DESK: ${{ inputs.desk }}
        PLUMBLINE_ISSUES: ${{ inputs.issues }}
        PLUMBLINE_OFFLINE: ${{ inputs.offline }}
        # for `agent`: the trust store, from a repository variable (the CLI reads it; it is public keys, not a secret)
        PLUMBLINE_APPROVERS: ${{ inputs.approvers }}
      run: |
        cli="$GITHUB_ACTION_PATH/../dist/cli/index.js"
        report="$RUNNER_TEMP/plumbline-$PLUMBLINE_COMMAND.json"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        case "$PLUMBLINE_COMMAND" in
          gate)
            # The exit code is read straight from the command: 0 passed by fail-on, 1 failed by it (or nothing was
            # checked), 2 usage. The gate never gets --allow-local here: CI checks public https sites only.
            set +e
            if [ -n "$PLUMBLINE_TARGET" ]; then
              node "$cli" gate "$PLUMBLINE_TARGET" --adapters "$PLUMBLINE_ADAPTERS" --fail-on "$PLUMBLINE_FAIL_ON" --json > "$report"
            else
              # UAT-22: no target: the site's files at root, before deployment; the validator only, nothing sent out
              node "$cli" gate --root "$GITHUB_WORKSPACE/$PLUMBLINE_ROOT" --fail-on "$PLUMBLINE_FAIL_ON" --json > "$report"
            fi
            code=$?
            set -e
            cat "$report"
            # One read of the report: the state output and the job summary (state=unknown when it cannot be read).
            node "$GITHUB_ACTION_PATH/report.mjs" gate "$report"
            exit "$code"
            ;;
          watch)
            # Exit 1 means warn or block findings, which is not a failure of this step; 2 is a real error.
            set +e
            node "$cli" watch --root "$GITHUB_WORKSPACE/$PLUMBLINE_ROOT" --json > "$report"
            code=$?
            set -e
            cat "$report"
            if [ "$code" -gt 1 ]; then echo "::error::plumbline watch failed with exit code $code"; exit "$code"; fi
            # One read of the report: the warn-or-block count and the drift issue's body. A report it cannot read
            # fails the step (exit 2), so a broken run is never taken for a clean one.
            node "$GITHUB_ACTION_PATH/report.mjs" watch "$report" "$RUNNER_TEMP/plumbline-issue.md"
            ;;
          agent)
            # Exit 0 clean and approved, 1 findings (an unapproved change among them), 2 usage or I/O. The check runs in
            # the repository folder; --offline asks no remote server or peer.
            offline=""
            if [ "$PLUMBLINE_OFFLINE" = "true" ]; then offline="--offline"; fi
            set +e
            (cd "$GITHUB_WORKSPACE/$PLUMBLINE_ROOT" && node "$cli" agent check $offline --json) > "$report"
            code=$?
            set -e
            cat "$report"
            # One read of the report: the state, the job summary (findings by code and ref), the count and the issue body.
            node "$GITHUB_ACTION_PATH/report.mjs" agent "$report" "$code" "$RUNNER_TEMP/plumbline-issue.md"
            if [ "$code" -gt 1 ]; then echo "::error::plumbline agent check failed with exit code $code"; exit "$code"; fi
            # With issues: true (the scheduled run) findings keep the issue and the step stays green, as watch does; as a
            # pull request's required check (issues: false) findings fail the step, so an unapproved change cannot merge.
            if [ "$PLUMBLINE_ISSUES" != "true" ]; then exit "$code"; fi
            ;;
          *) echo "::error::command must be gate, watch or agent"; exit 2 ;;
        esac

    # The drift issue, with `issues: true` (the input check allows that with watch and agent). report.mjs's issuePlan decides
    # from the count, this run's body (which carries the findings' digest) and the open issues; the next step only
    # carries the decision out.
    - name: Decide on the drift issue
      id: issue-plan
      if: inputs.issues == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        # `agent` keeps its own issue (title "Plumbline agent drift"), apart from a site's
        PLUMBLINE_COMMAND: ${{ inputs.command }}
        FINDINGS: ${{ steps.run.outputs.findings }}
        BODY: ${{ steps.run.outputs.issue-body }}
        REPORT: ${{ steps.run.outputs.report }}
      run: |
        title=$(node "$GITHUB_ACTION_PATH/report.mjs" title)
        open="$RUNNER_TEMP/plumbline-open-issues.json"
        gh issue list --state open --search "\"$title\" in:title" --json number,title,body --limit 50 > "$open"
        # the report, when there is one, gives each new finding in the comment its sentence
        node "$GITHUB_ACTION_PATH/report.mjs" issue "$FINDINGS" "$BODY" "$open" "$RUNNER_TEMP/plumbline-issue-comment.md" ${REPORT:+"$REPORT"}

    - name: Open, edit or close the drift issue
      if: inputs.issues == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        ISSUE_ACTION: ${{ steps.issue-plan.outputs.action }}
        NUMBER: ${{ steps.issue-plan.outputs.number }}
        COMMENT: ${{ steps.issue-plan.outputs.comment }}
        BODY: ${{ steps.run.outputs.issue-body }}
        ASSIGNEE: ${{ inputs.assignee }}
        PLUMBLINE_COMMAND: ${{ inputs.command }}
      run: |
        # UAT-30: the issue reaches a named person. An assignment GitHub refuses (no access, a typo) only warns: the
        # issue and its comments are never lost to it. The login was checked against its pattern before the build.
        assign() {
          if [ -n "$ASSIGNEE" ]; then
            gh issue edit "$1" --add-assignee "$ASSIGNEE" || echo "::warning::the drift issue could not be assigned to $ASSIGNEE (does the login have access to this repository?)"
          fi
        }
        case "$ISSUE_ACTION" in
          create)
            url=$(gh issue create --title "$(node "$GITHUB_ACTION_PATH/report.mjs" title)" --body-file "$BODY")
            echo "$url"
            assign "${url##*/}"
            ;;
          edit)
            # A body edit notifies nobody, so findings that changed also get a comment naming what is new.
            gh issue edit "$NUMBER" --body-file "$BODY"
            assign "$NUMBER"
            if [ -n "$COMMENT" ]; then gh issue comment "$NUMBER" --body-file "$COMMENT"; fi
            echo "Updated issue #$NUMBER"
            ;;
          close)
            gh issue close "$NUMBER" --comment "$(cat "$COMMENT")"
            echo "Closed issue #$NUMBER"
            ;;
          none) echo "The drift issue needs nothing." ;;
          *) echo "::error::no decision on the drift issue"; exit 2 ;;
        esac

    # The pull request, with `relock-pr: true` or `renew: true` (the input check allows each with watch only). The branch
    # is made from the commit this run checked out; the relock and the signature are made by the CLI built above. The key,
    # when given, reaches the CLI as an environment variable (`sign --key-env`), never as an argument or a file. report.mjs
    # decides from this run's outputs and the open pull requests; the next step only carries the decision out.
    - name: Decide on the pull request
      id: pr-plan
      if: inputs.relock-pr == 'true' || inputs.renew == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        MODE: ${{ inputs.relock-pr == 'true' && 'relock' || 'renew' }}
        REPORT: ${{ steps.run.outputs.report }}
        FINDINGS: ${{ steps.run.outputs.findings }}
        PLUMBLINE_ROOT: ${{ inputs.root }}
        # UAT-34: the key reaches this step only for a renewal; the relock (which reads strangers' files) never holds it
        PLUMBLINE_SIGNING_KEY: ${{ inputs.renew == 'true' && inputs.signing-key || '' }}
        PLUMBLINE_ORIGIN: ${{ inputs.origin }}
        PLUMBLINE_SITE_ADDRESS: ${{ inputs.site-address }}
        PLUMBLINE_DESK: ${{ inputs.desk }}
      run: |
        cli="$GITHUB_ACTION_PATH/../dist/cli/index.js"
        pr="$RUNNER_TEMP/plumbline-pr"
        mkdir -p "$pr"
        branch=$(node "$GITHUB_ACTION_PATH/report.mjs" pr-branch "$MODE")
        root="$GITHUB_WORKSPACE/$PLUMBLINE_ROOT"
        relock="-"
        signed="-"
        work="false"
        if [ "$MODE" = "relock" ] && [ "${FINDINGS:-0}" -gt 0 ]; then work="true"; fi
        if [ "$MODE" = "renew" ] && [ "$(node "$GITHUB_ACTION_PATH/report.mjs" renew-needed "$REPORT")" = "true" ]; then work="true"; fi
        if [ "$work" = "true" ]; then
          git -C "$GITHUB_WORKSPACE" switch -C "$branch"
          if [ "$MODE" = "relock" ]; then
            # exit 1 is a refused relock (a peer's signer changed: UAT-4), which the plan reads from relock.json and says
            # in the pull request; CI never passes --accept-signer. Exit 2 is a real error.
            set +e
            node "$cli" watch --root "$root" --relock --json > "$pr/relock.json"
            code=$?
            set -e
            if [ "$code" -gt 1 ]; then echo "::error::plumbline watch --relock failed with exit code $code"; exit "$code"; fi
            relock="$pr/relock.json"
          fi
          # UAT-34: only a renewal signs, over files already on the checked-out branch; a relock is signed by a person
          if [ "$MODE" = "renew" ] && [ -n "$PLUMBLINE_SIGNING_KEY" ]; then
            node "$cli" sign --root "$root" --key-env PLUMBLINE_SIGNING_KEY --origin "$PLUMBLINE_ORIGIN" --json > "$pr/sign.json"
            signed="$pr/sign.json"
          fi
        fi
        # isCrossRepository: --head matches the branch name alone, so a fork's pull request from a branch of the same
        # name is listed too; the plan never takes it for the Action's own (UAT-33)
        gh pr list --head "$branch" --state open --json number,body,isDraft,isCrossRepository > "$pr/open.json"
        node "$GITHUB_ACTION_PATH/report.mjs" pr "$MODE" "$REPORT" "$relock" "$signed" "$pr/open.json" "$pr/body.md" "$pr/comment.md"

    - name: Open, update or close the pull request
      if: inputs.relock-pr == 'true' || inputs.renew == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        PR_ACTION: ${{ steps.pr-plan.outputs.action }}
        NUMBER: ${{ steps.pr-plan.outputs.number }}
        DRAFT: ${{ steps.pr-plan.outputs.draft }}
        TITLE: ${{ steps.pr-plan.outputs.title }}
        BRANCH: ${{ steps.pr-plan.outputs.branch }}
        BODY: ${{ steps.pr-plan.outputs.body }}
        COMMENT: ${{ steps.pr-plan.outputs.comment }}
        PLUMBLINE_ROOT: ${{ inputs.root }}
      run: |
        push() {
          # Only the lock, the signature and the lock's kept peer copies are committed. The branch is this Action's own and is rebuilt from the
          # checked-out commit on every run, so it is replaced, with a lease that names what was fetched: the branch's
          # commit when it exists, or "must not exist" when it does not. A push to a URL has no remote-tracking ref, so a
          # lease without an expected value is refused as stale (UAT-5); one with a value replaces the branch on the
          # second run and after a merged pull request whose branch was kept.
          cd "$GITHUB_WORKSPACE"
          remote="https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git"
          git add -- "$PLUMBLINE_ROOT/plumbline.lock.json"
          if [ -f "$PLUMBLINE_ROOT/plumbline.signature.json" ]; then git add -- "$PLUMBLINE_ROOT/plumbline.signature.json"; fi
          # UAT-18: the relock's kept copies of what the lock pins of each peer, so plumbline diff --peer can show a change
          if [ -d "$PLUMBLINE_ROOT/.plumbline/peers" ]; then git add -- "$PLUMBLINE_ROOT/.plumbline/peers"; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "$TITLE" --quiet
          if git fetch --quiet "$remote" "+refs/heads/$BRANCH:refs/remotes/plumbline/$BRANCH" 2>/dev/null; then
            lease="refs/heads/$BRANCH:$(git rev-parse --verify --quiet "refs/remotes/plumbline/$BRANCH")"
          else
            lease="refs/heads/$BRANCH:"
          fi
          git push --quiet --force-with-lease="$lease" "$remote" "HEAD:refs/heads/$BRANCH"
        }
        case "$PR_ACTION" in
          create)
            push
            if [ "$DRAFT" = "true" ]; then gh pr create --draft --head "$BRANCH" --title "$TITLE" --body-file "$BODY"; else gh pr create --head "$BRANCH" --title "$TITLE" --body-file "$BODY"; fi
            ;;
          edit)
            push
            gh pr edit "$NUMBER" --body-file "$BODY"
            if [ "$DRAFT" = "true" ]; then gh pr ready "$NUMBER" --undo || true; else gh pr ready "$NUMBER" || true; fi
            echo "Updated pull request #$NUMBER"
            ;;
          describe)
            # the relock was refused (a signer change waits for a person): the body says so, nothing is pushed
            gh pr edit "$NUMBER" --body-file "$BODY"
            if [ -n "$COMMENT" ]; then gh pr comment "$NUMBER" --body-file "$COMMENT"; fi
            echo "Described pull request #$NUMBER"
            ;;
          close)
            gh pr close "$NUMBER" --comment "$(cat "$COMMENT")"
            echo "Closed pull request #$NUMBER"
            ;;
          none) echo "The pull request needs nothing." ;;
          *) echo "::error::no decision on the pull request"; exit 2 ;;
        esac
